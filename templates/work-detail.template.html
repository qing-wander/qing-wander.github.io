<style>
/* ── 主题：与首页 / 简历同一套配色（后台默认主题优先，访客手动切换覆盖）── */
html[data-theme="blueprint"] {
  --paper: #E9F1F8; --card: #F5FAFE; --ink: #123A5C; --ink-soft: #48678A;
  --orange: #E03E36; --blue: #1D6FB8; --green: #2E8B57;
}
html[data-theme="newsprint"] {
  --paper: #F4EDDA; --card: #FAF5E6; --ink: #1C1812; --ink-soft: #59503E;
  --orange: #C4112C; --blue: #1E3A5F; --green: #2F7D46;
}
html[data-theme="noir"] {
  --paper: #100E1A; --card: #1A1729; --ink: #ECE7FF; --ink-soft: #8F87AD;
  --orange: #FF3D8F; --blue: #22D3EE; --green: #9EE86B;
}

:root {
  --paper: #F3EEE2; --card: #FFFCF4; --ink: #141311; --ink-soft: #4A463F;
  --orange: #FF5A1E; --blue: #2B4BE0; --green: #1FA658;
  --border: 3px solid var(--ink);
  --shadow: 6px 6px 0 var(--ink);
  --shadow-sm: 4px 4px 0 var(--ink);
  --font-cn: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'Space Mono', 'SF Mono', Consolas, monospace;
  --font-tech: 'Share Tech Mono', 'Space Mono', monospace;
  --wrap: 1160px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 78px; overflow-x: clip; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-cn); font-size: 16px; line-height: 1.75;
  -webkit-font-smoothing: antialiased; overflow-x: clip;
}
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
::selection { background: var(--orange); color: #fff; }

/* ── 顶栏 ── */
.topbar {
  position: sticky; top: 0; z-index: 60;
  background: var(--ink); color: var(--paper);
  border-bottom: var(--border);
}
.topbar-inner {
  max-width: var(--wrap); margin: 0 auto; padding: 10px 22px;
  display: flex; align-items: center; gap: 16px; justify-content: space-between;
}
.topbar a { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; }
.topbar a:hover { color: var(--orange); }
.tb-left, .tb-right { display: flex; align-items: center; gap: 14px; }
.tb-brand { font-weight: 900; letter-spacing: .12em; font-size: 12px; }
.tb-tag {
  display: inline-block; padding: 2px 8px; border: 1.5px solid var(--paper);
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em;
}
.tb-live { color: var(--orange); }

/* ── 布局：内容 + 右侧目录 ── */
.wrap {
  max-width: var(--wrap); margin: 0 auto; padding: 34px 22px 90px;
  display: grid; grid-template-columns: minmax(0, 1fr) 208px; gap: 40px;
  align-items: start;
}
main { min-width: 0; order: 1; }

/* 目录 */
.toc { position: sticky; top: 86px; font-family: var(--font-mono); font-size: 11px; order: 2; }
.toc-title { font-size: 10px; letter-spacing: .18em; color: var(--ink-soft); margin-bottom: 10px; }
.toc a {
  display: flex; gap: 11px; padding: 5px 0; color: var(--ink-soft);
  border-left: 2px solid transparent; padding-left: 9px;
  transition: color .15s, border-color .15s;
}
.toc a:hover { color: var(--ink); }
.toc a.is-on { color: var(--ink); border-left-color: var(--orange); font-weight: 700; }
.toc a span { color: var(--ink-soft); opacity: .7; }
.toc-print { margin-top: 18px; padding-top: 12px; border-top: 1.5px dashed var(--ink-soft); }
.toc-print a { display: block; border: 0; padding-left: 0; color: var(--ink); text-decoration: underline; }

/* ── 通用区块 ── */
.sec { margin-bottom: 56px; scroll-margin-top: 88px; }
.sec-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.sec-no {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .16em;
  background: var(--ink); color: var(--paper); padding: 3px 7px;
}
.sec-title { font-size: clamp(21px, 2.4vw, 27px); font-weight: 900; letter-spacing: -.01em; line-height: 1.2; }
.sec-en {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .2em;
  color: var(--blue); text-transform: uppercase;
}
.sec-lead { font-size: 14px; color: var(--ink-soft); max-width: 62ch; margin-bottom: 18px; }

.card { background: var(--card); border: var(--border); box-shadow: var(--shadow-sm); padding: 18px 20px; }
.card + .card { margin-top: 14px; }

/* ── Hero ── */
.hero { border-bottom: var(--border); padding-bottom: 30px; margin-bottom: 34px; }
.hero-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.hero-no {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em;
  background: var(--orange); color: #fff; padding: 3px 8px; font-weight: 700;
}
.hero-kicker {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .18em;
  border: 1.5px solid var(--ink); padding: 2px 8px; color: var(--ink-soft);
}
.hero h1 { font-size: clamp(30px, 4.4vw, 46px); font-weight: 900; line-height: 1.14; letter-spacing: -.02em; }
.hero-en {
  display: block; margin-top: 6px; font-family: var(--font-mono);
  font-size: 11px; letter-spacing: .26em; color: var(--blue);
}
.hero-tagline {
  margin-top: 14px; font-size: clamp(16px, 1.8vw, 19px); font-weight: 700; line-height: 1.6;
  max-width: 34ch; border-left: 5px solid var(--orange); padding-left: 14px;
}
.hero-meta {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px;
  font-family: var(--font-mono); font-size: 11px;
}
.hero-meta span { border: 1.5px solid var(--ink); padding: 3px 9px; background: var(--card); }
.hero-meta .is-key { background: var(--ink); color: var(--paper); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em;
  border: var(--border); padding: 9px 15px; background: var(--card); color: var(--ink);
  box-shadow: 4px 4px 0 var(--ink); transition: transform .12s, box-shadow .12s;
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 6px 6px 0 var(--ink); }
.btn-solid { background: var(--ink); color: var(--paper); }
.btn-solid:hover { background: var(--orange); color: #fff; }
.btn-blue { background: var(--blue); color: #fff; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 24px; }
.kpi {
  border: var(--border); background: var(--card); padding: 12px 13px;
  box-shadow: var(--shadow-sm);
}
.kpi-num { font-family: var(--font-tech); font-size: 34px; line-height: 1; letter-spacing: -.02em; }
.kpi-num small { font-size: 12px; font-family: var(--font-mono); margin-left: 3px; color: var(--ink-soft); }
.kpi-label { margin-top: 7px; font-size: 12px; font-weight: 700; }
.kpi-note { margin-top: 2px; font-family: var(--font-mono); font-size: 10px; color: var(--ink-soft); }

/* ── 一页看懂 ── */
.psr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.psr-item { border: var(--border); background: var(--card); padding: 16px; position: relative; }
.psr-item::before {
  content: attr(data-k); position: absolute; top: -1px; right: -1px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em;
  background: var(--ink); color: var(--paper); padding: 2px 7px;
}
.psr-item h3 { font-size: 14px; margin-bottom: 8px; }
.psr-item p { font-size: 13.5px; color: var(--ink-soft); line-height: 1.7; }

/* ── 定位 ── */
.pos-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 14px; }
.pos-for { border-left: 5px solid var(--green); }
.pos-not { border-left: 5px solid var(--orange); }
.pos h3 { font-size: 13px; font-family: var(--font-mono); letter-spacing: .06em; margin-bottom: 8px; }
.pos p, .pos li { font-size: 13.5px; color: var(--ink-soft); }
.pos li { position: relative; padding-left: 15px; margin-top: 7px; }
.pos li::before { content: '✕'; position: absolute; left: 0; color: var(--orange); font-size: 11px; }
.pos-why {
  margin-top: 14px; padding: 14px 16px; border: 2px dashed var(--ink);
  font-size: 14px; font-weight: 700; background: transparent;
}

/* ── 架构 ── */
.arch { display: flex; flex-direction: column; gap: 0; border: var(--border); background: var(--card); box-shadow: var(--shadow-sm); }
.arch-row {
  display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 0;
  border-bottom: 2px solid var(--ink);
}
.arch-row:last-child { border-bottom: 0; }
.arch-key {
  background: var(--ink); color: var(--paper); padding: 14px 12px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em;
  display: flex; flex-direction: column; justify-content: center; gap: 4px;
}
.arch-key b { font-size: 13px; letter-spacing: .04em; font-family: var(--font-cn); font-weight: 900; }
.arch-key small { font-size: 9.5px; opacity: .7; letter-spacing: .04em; text-transform: uppercase; }
.arch-body { padding: 12px 16px; }
.arch-role { font-size: 11.5px; color: var(--ink-soft); font-family: var(--font-mono); margin-bottom: 8px; }
.arch-items { display: flex; flex-wrap: wrap; gap: 6px; }
.arch-items span {
  font-family: var(--font-mono); font-size: 10.5px; padding: 3px 8px;
  border: 1.5px solid var(--ink); background: var(--paper);
}
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
.flow-step {
  font-family: var(--font-mono); font-size: 11px; padding: 5px 10px;
  background: var(--ink); color: var(--paper);
}
.flow-arrow { font-family: var(--font-mono); color: var(--orange); font-weight: 700; }

/* ── 表格 ── */
.tbl-wrap { overflow-x: auto; border: var(--border); background: var(--card); box-shadow: var(--shadow-sm); }
table.tbl { width: 100%; border-collapse: collapse; min-width: 640px; }
.tbl th, .tbl td { text-align: left; padding: 12px 14px; border-bottom: 2px solid var(--ink); vertical-align: top; font-size: 13.5px; }
.tbl th { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; background: var(--ink); color: var(--paper); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.ch { font-weight: 700; width: 30%; }
.tbl td.why { color: var(--ink-soft); }
.tbl td.rj { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-soft); }

/* ── 能力卡 ── */
.caps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cap { border: var(--border); background: var(--card); box-shadow: var(--shadow-sm); padding: 16px 17px; }
.cap-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.cap h3 { font-size: 15px; font-weight: 900; }
.cap-dot { width: 10px; height: 10px; background: var(--orange); border: 1.5px solid var(--ink); flex: 0 0 auto; }
.cap-row { margin-top: 9px; font-size: 13px; color: var(--ink-soft); }
.cap-row b { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; color: var(--ink); margin-bottom: 2px; }
.cap-proof {
  margin-top: 11px; padding-top: 9px; border-top: 1.5px dashed var(--ink-soft);
  font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-soft);
}

/* ── 数据链路 ── */
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: var(--border); background: var(--card); box-shadow: var(--shadow-sm); }
.step { padding: 14px 13px; border-right: 2px solid var(--ink); }
.step:last-child { border-right: 0; }
.step-no { font-family: var(--font-mono); font-size: 10px; color: var(--orange); letter-spacing: .1em; }
.step h4 { font-size: 13.5px; margin: 4px 0 5px; }
.step p { font-size: 12px; color: var(--ink-soft); line-height: 1.6; }
.tree {
  margin-top: 14px; border: var(--border); background: var(--ink); color: var(--paper);
  padding: 16px 18px; overflow-x: auto;
}
.tree pre { font-family: var(--font-mono); font-size: 11.5px; line-height: 1.9; white-space: pre; }

/* ── 难题 ── */
.issue { border: var(--border); background: var(--card); box-shadow: var(--shadow-sm); margin-bottom: 14px; }
.issue-head { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-bottom: 2px solid var(--ink); background: var(--paper); }
.issue-id { font-family: var(--font-mono); font-size: 10px; background: var(--orange); color: #fff; padding: 2px 7px; letter-spacing: .08em; }
.issue-head h3 { font-size: 15px; font-weight: 900; }
.issue-body { padding: 6px 16px 14px; }
.issue-row { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-bottom: 1.5px dashed var(--ink-soft); }
.issue-row:last-child { border-bottom: 0; }
.issue-k { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; color: var(--ink-soft); padding-top: 3px; }
.issue-v { font-size: 13.5px; }
.issue-v.is-result { font-weight: 700; color: var(--green); }

/* ── 成果 ── */
.metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.metric { border: var(--border); background: var(--card); padding: 14px 15px; box-shadow: var(--shadow-sm); }
.metric-num { font-family: var(--font-tech); font-size: 30px; line-height: 1; }
.metric-num small { font-family: var(--font-mono); font-size: 11px; margin-left: 3px; color: var(--ink-soft); }
.metric-label { margin-top: 6px; font-size: 12px; color: var(--ink-soft); }
.evidence { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.evidence a {
  font-family: var(--font-mono); font-size: 11px; border: 1.5px solid var(--ink);
  padding: 5px 10px; background: var(--card);
}
.evidence a:hover { background: var(--ink); color: var(--paper); }

/* ── 亮点 ── */
.hls { display: flex; flex-direction: column; gap: 10px; }
.hl { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 12px; border: var(--border); background: var(--card); padding: 13px 15px; }
.hl-no { font-family: var(--font-tech); font-size: 22px; line-height: 1; color: var(--orange); }
.hl h3 { font-size: 14.5px; margin-bottom: 3px; }
.hl p { font-size: 13px; color: var(--ink-soft); }

/* ── 路线 ── */
.road { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.road-col { border: var(--border); background: var(--card); padding: 14px 15px; box-shadow: var(--shadow-sm); }
.road-col h3 {
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em;
  padding-bottom: 8px; margin-bottom: 9px; border-bottom: 2px solid var(--ink);
}
.road-col.now h3 { color: var(--orange); }
.road-col li { font-size: 13px; color: var(--ink-soft); position: relative; padding-left: 14px; margin-top: 7px; }
.road-col li::before { content: '▸'; position: absolute; left: 0; color: var(--orange); }

/* ── 复盘 ── */
.quote {
  border: var(--border); border-left-width: 9px; background: var(--card);
  padding: 20px 22px; font-size: clamp(16px, 1.9vw, 20px); font-weight: 900; line-height: 1.7;
  box-shadow: var(--shadow-sm);
}
.retro-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
.retro-col { border: var(--border); background: var(--card); padding: 15px 16px; }
.retro-col h3 { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; margin-bottom: 9px; }
.retro-col li { font-size: 13px; color: var(--ink-soft); position: relative; padding-left: 16px; margin-top: 8px; }
.retro-col li::before { content: counter(item, decimal-leading-zero); counter-increment: item; position: absolute; left: 0; font-family: var(--font-mono); font-size: 10px; color: var(--orange); top: 4px; }
.retro-col ol { counter-reset: item; }

/* ── 页尾 CTA ── */
.cta {
  border: var(--border); background: var(--ink); color: var(--paper);
  padding: 24px; display: flex; flex-wrap: wrap; gap: 14px;
  align-items: center; justify-content: space-between;
}
.cta p { font-size: 14px; max-width: 46ch; opacity: .85; }
.cta .btn { box-shadow: 4px 4px 0 var(--orange); border-color: var(--paper); }
.cta .btn-solid { background: var(--orange); color: #fff; border-color: var(--orange); }

.foot {
  max-width: var(--wrap); margin: 0 auto; padding: 18px 22px 40px;
  font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft);
  display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between;
}

/* ── 响应式 ── */
@media (max-width: 1080px) {
  .wrap { grid-template-columns: minmax(0, 1fr); padding-top: 22px; }
  .toc { position: static; display: flex; flex-wrap: wrap; gap: 6px; order: -1; }
  .toc-title, .toc-print { display: none; }
  .toc a {
    border: 1.5px solid var(--ink); padding: 3px 9px; font-size: 10.5px;
    background: var(--card);
  }
  .toc a.is-on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .pos-grid { grid-template-columns: minmax(0, 1fr); }
  .caps { grid-template-columns: minmax(0, 1fr); }
}

@media (max-width: 760px) {
  body { font-size: 15px; }
  .wrap { padding: 16px 14px 60px; gap: 18px; }
  .hero h1 { font-size: 30px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .psr { grid-template-columns: minmax(0, 1fr); }
  .arch-row { grid-template-columns: 86px minmax(0, 1fr); }
  .arch-key { padding: 10px 8px; }
  .arch-items span { font-size: 10px; }
  .steps { grid-template-columns: minmax(0, 1fr); }
  .step { border-right: 0; border-bottom: 2px solid var(--ink); }
  .step:last-child { border-bottom: 0; }
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .road { grid-template-columns: minmax(0, 1fr); }
  .retro-grid { grid-template-columns: minmax(0, 1fr); }
  .issue-row { grid-template-columns: minmax(0, 1fr); gap: 3px; }
  .issue-k { padding-top: 0; }
  .tb-right .tb-extra { display: none; }
}

/* ── 打印：HR 直接存 PDF ── */
@media print {
  /* 打印一律黑白：html[data-theme] 特异性高于 :root，必须显式覆盖，
     否则访客停在 dark 主题时打印会输出整页深色块 */
  html,
  html[data-theme],
  html[data-theme="blueprint"],
  html[data-theme="newsprint"],
  html[data-theme="noir"] {
    --paper: #fff; --card: #fff; --ink: #000; --ink-soft: #333;
    --orange: #000; --blue: #000; --green: #000;
  }
  body { background: #fff; color: #000; }
  body { font-size: 11pt; }
  .topbar, .toc, .hero-actions, .cta .btn, .evidence, .foot { display: none !important; }
  .wrap { display: block; max-width: none; padding: 0; }
  .sec { margin-bottom: 22px; break-inside: avoid; }
  .card, .kpi, .cap, .issue, .metric, .road-col, .retro-col, .arch, .tbl-wrap, .steps, .quote {
    box-shadow: none; border-color: #000;
  }
  .tree { background: #fff; color: #000; border-color: #000; }
  .hero { border-bottom: 2px solid #000; }
  a { text-decoration: none; color: #000; }
  .issue, .cap, .metric, .road-col { break-inside: avoid; }
}
</style>
</head>

    <div class="tb-left">
      <a href="../index.html#works">← 个人作品</a>

    </div>

      <span class="tb-tag">独立 0→1</span>
      <a class="tb-live tb-extra" href="../resume.html">网页简历 ↗</a>
    </div>

</header>

<div class="wrap">
  <nav class="toc" aria-label="章节导航">

<script>
/* 主题引导：?theme= > 手动锁定 > 后台默认 > 固定默认 ARCHIVE（每日轮换已暂停）
   与首页 / 简历同一套线路规则：纯静态域名下接口在 pages.dev。 */
(function () {
  var T = ['archive', 'blueprint', 'newsprint', 'noir'];
  var qs = new URLSearchParams(location.search).get('theme');
  /* 每日自动轮换已暂停（AUTO_ROTATE=false）：默认固定橙色档案纸 ARCHIVE。
     一次性清掉轮换期间留下的手动锁定，避免老访客仍停在深色主题；
     之后访客主动切换风格仍然有效。把 AUTO_ROTATE 改回 true 可恢复旧轮换逻辑。 */
  var AUTO_ROTATE = false;
  var DEFAULT_THEME = 'archive';
  try {
    if (!AUTO_ROTATE && localStorage.getItem('portfolio_theme_rotation_off') !== '1') {
      localStorage.removeItem('portfolio_theme_mode');
      localStorage.removeItem('portfolio_theme_manual');
      localStorage.setItem('portfolio_theme_rotation_off', '1');
    }
  } catch (e) {}
  var manual = null;
  try { if (localStorage.getItem('portfolio_theme_mode') === 'manual') manual = localStorage.getItem('portfolio_theme_manual'); } catch (e) {}
  var t = T.indexOf(qs) >= 0 ? qs : (T.indexOf(manual) >= 0 ? manual : null);
  if (!t) {
    var n = new Date();
    var day = Math.floor((n - new Date(n.getFullYear(), 0, 0)) / 864e5);
    t = AUTO_ROTATE ? T[day % T.length] : DEFAULT_THEME;
    if (T.indexOf(qs) < 0 && !manual) {
      var bases = (function () {
        var host = location.hostname || '';
        if (/^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(host)) return [''];
        if (/\.github\.io$/i.test(host)) return ['https://qing-wander.pages.dev'];
        return ['', 'https://qing-wander.pages.dev'];
      })();
      (function next(i) {
        if (i >= bases.length) return;
        fetch(new URL(bases[i] + '/api/theme', location.href).href, { credentials: 'omit' }).then(function (r) {
          var ct = r.headers.get('content-type') || '';
          if (!r.ok || ct.indexOf('application/json') < 0) return next(i + 1);
          return r.json().then(function (d) {
            if (d && d.ok && T.indexOf(d.theme) >= 0) document.documentElement.setAttribute('data-theme', d.theme);
            else next(i + 1);
          }, function () { next(i + 1); });
        }, function () { next(i + 1); });
      })(0);
    }
  }
  if (t) document.documentElement.setAttribute('data-theme', t);
})();

/* 目录高亮：IntersectionObserver，滚动时标出当前章节 */
(function () {
  var links = [].slice.call(document.querySelectorAll('.toc a[href^="#"]'));
  if (!links.length || !('IntersectionObserver' in window)) return;
  var map = {};
  links.forEach(function (a) { map[a.getAttribute('href').slice(1)] = a; });
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (!en.isIntersecting) return;
      links.forEach(function (a) { a.classList.remove('is-on'); });
      if (map[en.target.id]) map[en.target.id].classList.add('is-on');
    });
  }, { rootMargin: '-20% 0px -70% 0px', threshold: 0 });
  document.querySelectorAll('main section[id]').forEach(function (s) { io.observe(s); });
})();
</script>
