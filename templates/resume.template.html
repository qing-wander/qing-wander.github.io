<style>
/* ── 主题（与首页同一套配色，后台可设站点默认；访客手动切换优先）── */
html[data-theme="blueprint"] {
  --paper: #E9F1F8; --card: #F5FAFE; --ink: #123A5C; --ink-soft: #48678A;
  --orange: #E03E36; --blue: #1D6FB8; --green: #2E8B57;
}
html[data-theme="newsprint"] {
  --paper: #F4EDDA; --card: #FAF5E6; --ink: #1C1812; --ink-soft: #59503E;
  --orange: #C4112C; --blue: #1E3A5F; --green: #2F7D46;
}
html[data-theme="noir"] {
  --paper: #100E1A; --card: #1A1729; --ink: #ECE7FF; --ink-soft: #8F87AD;
  --orange: #FF3D8F; --blue: #22D3EE; --green: #9EE86B;
}

:root {
  --paper: #F3EEE2; --card: #FFFCF4; --ink: #141311; --ink-soft: #4A463F;
  --orange: #FF5A1E; --blue: #2B4BE0; --green: #1FA658;
  --border: 3px solid var(--ink);
  --font-cn: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-display: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'Space Mono', 'SF Mono', Consolas, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }

/* ── 配置项：头像显示开关 ─────────────────────
   1 = 显示头像，0 = 隐藏头像（结构保留，改回 1 即恢复） */
.avatar { display: none; }              /* 默认隐藏；恢复头像改为 display: block; */
.avatar img { display: block; }         /* 头像内部规则，恢复时无需改动 */

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-cn);
  font-size: 14px;
  line-height: 1.7;
  padding: 28px 18px 80px;
}
.sheet {
  max-width: 860px;
  margin: 0 auto;
  background: var(--card);
  border: 4px solid var(--ink);
  box-shadow: 10px 10px 0 var(--ink);
}
.sheet-head {
  display: flex;
  gap: 22px;
  padding: 26px 30px;
  border-bottom: var(--border);
  align-items: center;
  flex-wrap: wrap;
}
.avatar {
  width: 96px; height: 96px;
  border: var(--border);
  flex-shrink: 0;
  overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.head-main { flex: 1; min-width: 240px; }
.head-name {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 42px;
  line-height: 1.1;
  letter-spacing: .02em;
  text-shadow: 3px 3px 0 rgba(255, 90, 30, .8);
}
/* 姓名与意向岗位同一行：岗位字号取姓名（42px）的一半 */
.head-line { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; }
.head-role { font-family: var(--font-mono); font-size: 21px; font-weight: 700; letter-spacing: .03em; line-height: 1.2; margin: 0; }
.head-role em { font-style: normal; color: var(--blue); }
.head-meta {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 700;
  line-height: 2;
  color: var(--ink-soft);
  margin-top: 5px;            /* 与「姓名/岗位」行的间距，对齐 meta 内部行距 */
}
.head-meta b { color: var(--ink); }
/* 头部图标（如 GitHub）：按字号缩放、垂直居中，颜色跟随文字 */
.head-meta .meta-icon {
  display: inline-block;
  width: 12px; height: 12px;
  vertical-align: -1px;
  color: var(--ink);
}
/* 头部链接：悬停高亮 + 点击跳转（打印时呈现纯文本样式） */
.head-meta .link {
  color: inherit;
  text-decoration: none;
  border-bottom: 1.5px solid transparent;
  transition: color .15s ease, border-color .15s ease;
  cursor: pointer;
}
.head-meta .link:hover {
  color: var(--blue) !important;
  border-bottom-color: var(--blue);
}
/* 项目条目域名链接：与头部链接同款悬停高亮 + 新窗口跳转（打印时纯文本） */
.item-title a,
.pts a {
  color: inherit;
  text-decoration: none;
  border-bottom: 1.5px solid transparent;
  transition: color .15s ease, border-color .15s ease;
  cursor: pointer;
}
.item-title a:hover,
.pts a:hover {
  color: var(--blue) !important;
  border-bottom-color: var(--blue);
}
@media print {
  .head-meta .link { color: inherit; border-bottom: none; text-decoration: none; }
  .item-title a, .pts a { color: inherit; border-bottom: none; text-decoration: none; }
}
.file-no {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  background: var(--ink);
  color: var(--paper);
  padding: 4px 9px;
  align-self: flex-start;
}
.sec { padding: 22px 30px; border-bottom: 2px solid var(--ink); }
.sec:last-child { border-bottom: none; }
.sec-title {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.sec-no {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  background: var(--orange);
  color: #fff;
  padding: 3px 8px;
  border: 2px solid var(--ink);
}
.sec-title h2 {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 900;
  line-height: 1;
}
.sec-line { flex: 1; border-top: 2px solid var(--ink); }

.item { margin-bottom: 16px; }
.item:last-child { margin-bottom: 0; }
.item-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
}
.item-title { font-size: 16px; font-weight: 900; }
/* 项目定位引言：竖线引用样式 */
.proj-lead {
  display: flex;
  gap: 6px;
  margin: 4px 0 2px;
  font-size: 12.5px;
  line-height: 1.75;
  color: #8A8A8A;
}
.proj-lead-bar { color: var(--orange); font-weight: 900; flex-shrink: 0; }
.item-title span { font-weight: 500; color: var(--ink-soft); font-size: 13.5px; margin-left: 8px; }
.item-time { font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; color: var(--blue); white-space: nowrap; }
.pts { margin-top: 6px; }
.sec-intro { margin-top: 6px; color: var(--ink-soft); }
.pts li {
  position: relative;
  padding-left: 18px;
  color: var(--ink-soft);
  margin-bottom: 3px;
  list-style: none;
}
.pts li::before { content: '▪'; position: absolute; left: 2px; color: var(--orange); }
.pts strong { color: var(--ink); }

/* ── 学信网学历验证码区块 ── */
.edu-verify {
  display: flex;
  gap: 14px;
  align-items: center;
  margin-top: 10px;
  padding: 8px 12px;
  border: 2px dashed var(--ink);
  background: var(--paper);
}
.edu-verify-text { flex: 1; min-width: 0; }
.edu-verify-label { font-size: 11px; font-weight: 700; color: var(--ink-soft); }
.edu-verify-code { font-family: var(--font-mono); font-size: 12.5px; font-weight: 700; letter-spacing: .04em; }
.edu-verify-tip { font-family: var(--font-mono); font-size: 10px; color: var(--ink-soft); }
.edu-verify-qr {
  width: 72px; height: 72px;
  flex-shrink: 0;
  border: 2px solid var(--ink);
  background: #fff;
  image-rendering: pixelated;
}
.kv { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 24px; }
.kv li { list-style: none; font-size: 14px; }
.kv b { color: var(--blue); font-family: var(--font-mono); font-size: 12px; margin-right: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tags span {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  border: 2px solid var(--ink);
  padding: 4px 9px;
  background: var(--paper);
}
.tags .t-o { background: var(--orange); color: #fff; }
.tags .t-b { background: var(--blue); color: #fff; }

/* ── 专业技能：分类 + 掌握层级两行式（ATS 友好） ── */
.skill-cats { display: flex; flex-direction: column; }
.skill-cat {
  display: grid;
  grid-template-columns: 112px 1fr;
  gap: 4px 18px;
  padding: 10px 0;
  border-bottom: 1.5px dashed rgba(20, 19, 17, .3);
}
.skill-cat:last-child { border-bottom: none; padding-bottom: 2px; }
.skill-cat:first-child { padding-top: 4px; }
.skill-cat-name {
  font-weight: 900;
  font-size: 13.5px;
  line-height: 1.5;
  align-self: start;
  padding-top: 1px;
}
.skill-row-main { font-size: 13px; line-height: 1.9; font-weight: 700; }
.skill-row-main b { font-weight: 700; }
.skill-row-main em {
  font-style: normal;
  font-weight: 700;
  border: 1.5px solid var(--ink);
  padding: 0 5px;
  margin: 0 1px;
  color: #fff;
}
/* 高亮块交替使用主题橙 / 蓝（与页面强调色体系一致）；.em-b 强制蓝色 */
.skill-row-main em:nth-of-type(odd) { background: var(--orange); }
.skill-row-main em:nth-of-type(even) { background: var(--blue); }
.skill-row-main em.em-b { background: var(--blue); }
.skill-row-main small {
  font-size: 10px;
  font-weight: 500;
  color: var(--ink-soft);
}
.skill-row-sub {
  font-size: 11.5px;
  line-height: 1.7;
  color: #7d786e;
  margin-top: 1px;
}

.actions {
  max-width: 860px;
  margin: 26px auto 0;
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 700;
  padding: 14px 24px;
  border: 3px solid var(--ink);
  background: var(--card);
  color: var(--ink);
  cursor: pointer;
  text-decoration: none;
  box-shadow: 4px 4px 0 var(--ink);
  transition: transform .15s ease, box-shadow .15s ease;
  font-family: var(--font-cn);
}
.btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
.btn-solid { background: var(--orange); color: #fff; }
.btn-blue { background: var(--blue); color: #fff; }
.btn-green { background: var(--green); color: #fff; }
.btn-deliver { background: var(--ink); color: #fff; }

/* ── 简历转发弹窗 ── */
.dl-overlay {
  position: fixed;
  inset: 0;
  z-index: 420;
  background: rgba(20, 19, 17, .55);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.dl-overlay.show { display: flex; }
.dl-panel {
  position: relative;
  background: var(--card);
  border: 4px solid var(--ink);
  box-shadow: 10px 10px 0 var(--ink);
  width: min(480px, 100%);
  max-height: calc(100vh - 48px);
  display: flex;
  flex-direction: column;
  overflow: hidden;           /* 由 #dlForm 内部滚动，头部与提交区固定 */
  padding: 26px 28px 24px;
}
.dl-close {
  position: absolute;
  top: 10px; right: 10px;
  width: 36px; height: 36px;
  border: 2px solid var(--ink);
  background: var(--card);
  font-size: 20px;
  font-weight: 900;
  cursor: pointer;
}
.dl-close:hover { background: var(--orange); color: #fff; }
.dl-head { margin-bottom: 18px; padding-right: 40px; flex-shrink: 0; }
.dl-badge {
  display: inline-block;
  font-family: var(--font-mono, monospace);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .14em;
  background: var(--ink);
  color: #fff;
  padding: 4px 9px;
}
.dl-head h3 {
  font-size: 24px;
  font-weight: 900;
  margin: 10px 0 8px;
  line-height: 1.25;
}
.dl-sub { font-size: 13px; line-height: 1.7; color: var(--ink-soft); }
.dl-form, .dl-field { display: flex; flex-direction: column; gap: 7px; }
#dlForm {
  display: flex;
  flex-direction: column;
  gap: 18px;
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding-right: 4px;
}
.dl-label {
  font-family: var(--font-mono, monospace);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .06em;
  color: var(--ink);
}
.dl-field input, .dl-field textarea {
  font-family: inherit;
  font-size: 14px;
  border: 2px solid var(--ink);
  background: var(--paper);
  color: var(--ink);
  padding: 10px 12px;
  width: 100%;
}
.dl-field input:focus, .dl-field textarea:focus {
  outline: 3px solid var(--orange);
  outline-offset: 2px;
}
.dl-field textarea { resize: vertical; min-height: 74px; line-height: 1.7; }
.dl-required .dl-label::after { content: ' *'; color: var(--orange); }
/* 提交区：常驻弹窗底部，只有表单字段区滚动，按钮任何屏幕尺寸都可见 */
.dl-foot {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 14px;
  flex-wrap: wrap;
  flex-shrink: 0;
  padding-top: 12px;
  border-top: 2px solid rgba(20, 19, 17, .14);
}
.dl-tip { font-size: 11.5px; color: var(--ink-soft); flex: 1; min-width: 160px; line-height: 1.6; }
.dl-send { flex-shrink: 0; }
.dl-send:disabled { opacity: .55; cursor: not-allowed; }
.dl-alt {
  flex-shrink: 0;
  margin-top: 16px;
  border-top: 2px dashed rgba(20,19,17,.3);
  padding-top: 14px;
}
.dl-alt p { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 10px; }
@media (max-width: 480px) {
  .dl-overlay { padding: 10px; }
  .dl-panel { padding: 20px 18px 14px; max-height: calc(100vh - 20px); }
  .dl-head { margin-bottom: 12px; }
  .dl-head h3 { font-size: 20px; }
  .dl-sub { line-height: 1.6; }
  #dlForm { gap: 14px; }
  .dl-field textarea { min-height: 56px; }
  .dl-foot { flex-direction: column; align-items: stretch; gap: 8px; margin-top: 10px; padding-top: 10px; }
  .dl-tip { min-width: 0; }
  .dl-send { width: 100%; }
}

/* ── 长图预览模态框 ── */
.lg-overlay {
  position: fixed;
  inset: 0;
  z-index: 400;
  background: rgba(20, 19, 17, .55);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.lg-overlay.show { display: flex; }
.lg-panel {
  background: var(--card);
  border: 4px solid var(--ink);
  box-shadow: 10px 10px 0 var(--ink);
  width: min(880px, 100%);
  max-height: 90vh;
  display: flex;
  flex-direction: column;
}
.lg-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  border-bottom: 3px solid var(--ink);
}
.lg-title {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .06em;
}
.lg-close {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  line-height: 1;
  width: 32px;
  height: 32px;
  background: var(--ink);
  color: var(--paper);
  border: 2px solid var(--ink);
  cursor: pointer;
}
.lg-close:hover { background: var(--orange); border-color: var(--orange); }
.lg-body {
  overflow: auto;
  padding: 16px;
  background: var(--paper);
  flex: 1;
  min-height: 0;
}
.lg-body img { display: block; width: 100%; }
.lg-foot {
  display: flex;
  justify-content: center;
  gap: 14px;
  padding: 14px 18px;
  border-top: 3px solid var(--ink);
}

/* ── 打印样式：与屏幕显示保持一致（米白底 + 粗边框 + 偏移阴影） ── */
@page { size: A4; margin: 0; }
@media print {
  /* 强制输出背景色 / 边框 / 阴影 / 文字阴影（浏览器打印时无需勾选「背景图形」） */
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

  /* 背景只挂在 body 上：body 背景会自动传播铺满整个打印画布。
     若同时给 html 设背景，黑白模式的 bw-print 类挂在 body 上覆盖变量后，
     html 仍取 :root 的米黄色，会在页边与正文盒子之外漏色。 */
  body { background: var(--paper) !important; }
  body { padding: 14px 14px; font-size: 12.6px; }
  /* 头部信息行与网页端一致：保持原字号、禁止换行，避免邮箱被挤到下一行 */
  .head-meta { font-size: 11.5px; }
  .head-meta p { white-space: nowrap; }
  .sheet {
    border: 4px solid var(--ink);
    box-shadow: 10px 10px 0 var(--ink);
    max-width: 860px;
    margin: 0 auto;
    background: var(--card);
  }
  .actions { display: none; }
  .lg-overlay { display: none !important; }
  .sec { padding: 7px 22px; }
  .sec-title { margin-bottom: 10px; }
  .item { break-inside: avoid; margin-bottom: 5px; }
  .pts { margin-top: 3px; }
  .pts li { margin-bottom: 0; line-height: 1.65; }
  .sheet-head { padding: 10px 22px; }
  /* 要点行字距微收约 3%（肉眼不可辨），避免个别长行出现孤字换行 */
  .pts li { letter-spacing: -0.03em; }
  /* 技能分类区块紧凑化，保证两页收束 */
  .skill-cat { padding: 3px 0; }
  .skill-row-main { line-height: 1.6; font-size: 12.3px; letter-spacing: -0.02em; }
  .skill-row-main small { font-size: 9.5px; }
  .skill-row-sub { line-height: 1.45; font-size: 10.8px; margin-top: 0; }
  .edu-verify { padding: 4px 10px; gap: 10px; }
  .edu-verify-qr { width: 60px; height: 60px; }

  /* ── 黑白打印模式：布局样式不变，仅保留黑白两色（纸质打印省墨兼容） ── */
  body.bw-print {
    --paper: #ffffff;
    --card: #ffffff;
    --ink: #000000;
    --ink-soft: #000000;
    --orange: #000000;
    --blue: #000000;
  }
  /* 板块序号块与技能高亮块：实心底改为白底黑字描边（保留原有边框，宽度零变化） */
  body.bw-print .sec-no { background: #ffffff; color: #000000; }
  body.bw-print .skill-row-main em { background: #ffffff; color: #000000; }
  /* 姓名去掉阴影：避免与加粗黑字重叠发闷 */
  body.bw-print .head-name { text-shadow: none; }
  body.bw-print img { filter: grayscale(1); }
  body.bw-print .edu-verify { background: #ffffff; }

<script>
/* 主题引导（优先级：?theme= > 手动锁定 > 后台默认 > 按日期轮换）
   后台默认由 /api/theme 下发（D1 admin_config），访客手动切换仍覆盖它。
   github.io 是纯静态站，/api/theme 本地必然 404，所以与 main.js 的 API_BASES
   共用同一套线路规则：github.io → pages.dev；逐个尝试，拿到 JSON 才采用。 */
(function () {
  var T = ['archive', 'blueprint', 'newsprint', 'noir'];
  var qs = new URLSearchParams(location.search).get('theme');
  var manual = null;
  try { if (localStorage.getItem('portfolio_theme_mode') === 'manual') manual = localStorage.getItem('portfolio_theme_manual'); } catch (e) {}
  var t = T.indexOf(qs) >= 0 ? qs : (T.indexOf(manual) >= 0 ? manual : null);
  if (!t) {
    var n = new Date();
    var day = Math.floor((n - new Date(n.getFullYear(), 0, 0)) / 864e5);
    t = T[day % T.length];
    if (T.indexOf(qs) < 0 && !manual) {
      var bases = (function () {
        var host = location.hostname || '';
        if (/^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(host)) return [''];
        if (/\.github\.io$/i.test(host)) return ['https://shenge-work.pages.dev'];
        return ['', 'https://shenge-work.pages.dev'];
      })();
      (function next(i) {
        if (i >= bases.length) return;
        fetch(new URL(bases[i] + '/api/theme', location.href).href, { credentials: 'omit' }).then(function (r) {
          var ct = r.headers.get('content-type') || '';
          if (!r.ok || ct.indexOf('application/json') < 0) return next(i + 1);
          return r.json().then(function (d) {
            if (d && d.ok && T.indexOf(d.theme) >= 0) document.documentElement.setAttribute('data-theme', d.theme);
            else next(i + 1);
          }, function () { next(i + 1); });
        }, function () { next(i + 1); });
      })(0);
    }
  }
  if (t) document.documentElement.setAttribute('data-theme', t);
})();
</script>

<!-- ── 转发弹窗：浏览者填收件人邮箱，把在线简历发给对方（自己 / 同事 / 指定人） ── -->
<!-- ── 转发弹窗：浏览简历的人填收件人邮箱，把在线简历发到对方邮箱（无需下载附件） ── -->
<div class="dl-overlay" id="dlOverlay" role="dialog" aria-modal="true" aria-labelledby="dlTitle">

      <a class="btn" id="dlMailto" href="#" data-analytics="resume_deliver_mailto">用邮箱客户端发送 ↗</a>

<script>
/* ── 简历转发（Resend 经 Cloudflare Pages Function /api/deliver 发给访客指定的收件人）──
   方向：访客 → 收件人（自己 / 同事 / 指定人），不是发给站长。
   设计要点：
   · API key 只在 Cloudflare 环境变量里，前端永不接触；
   · file:// 、函数未配置（503）或域名未验证（recipient_not_verified）→ 自动展示 mailto 兜底；
   · 发送中防重复点击；成功后关窗 + 提示。 */
var DL_STATE = { sending: false };
var DL_EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

/* 结果级埋点：只上报状态与数量，不上报邮箱等个人信息 */
function dlTrack(name, data) {
  if (typeof window.portfolioTrack === 'function') window.portfolioTrack(name, data || {});
}

function dlRecipients() {
  var raw = document.getElementById('dlTo').value || '';
  var list = raw.split(/[,;，；\s]+/).map(function (s) { return s.trim().toLowerCase(); }).filter(Boolean);
  var uniq = [];
  list.forEach(function (e) { if (uniq.indexOf(e) < 0) uniq.push(e); });
  return uniq;
}

function openDeliver() {
  var o = document.getElementById('dlOverlay');
  o.classList.add('show');
  document.getElementById('dlAlt').hidden = true;
  setTimeout(function () { document.getElementById('dlTo').focus(); }, 60);
}
function closeDeliver() {
  document.getElementById('dlOverlay').classList.remove('show');
}
(function () {
  var overlay = document.getElementById('dlOverlay');
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) closeDeliver();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && overlay.classList.contains('show')) closeDeliver();
  });
})();

function buildMailto() {
  var to = dlRecipients();
  var name = document.getElementById('dlName').value.trim();
  var email = document.getElementById('dlEmail').value.trim();
  var note = document.getElementById('dlNote').value.trim();
  var subject = '陈培胜 · AI Agent 工程师 · 在线简历' + (name ? '（' + name + ' 转发）' : '');
  var lines = [
    '这是一份在线简历，点开即可查看完整内容（无需下载附件）：',
    '',
    '简历地址：https://chenpeisheng.cn/resume.html',
    '备用地址：https://shenge-work.pages.dev/resume.html',
    '',
    '陈培胜 · AI Agent 工程师 · 5 年研发 · Agent 开发 / AI 工程化 / 企业 AI 基建',
    '联系邮箱：hi@chenpeisheng.cn'
  ];
  if (note) lines = lines.concat(['', '—— 转发人附言 ——', note]);
  if (name || email) lines = lines.concat(['', '转发人：' + [name, email].filter(Boolean).join(' / ')]);
  return 'mailto:' + encodeURIComponent(to.join(',')) + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(lines.join('\n'));
}

/* API 双线路：GitHub Pages 无 Functions，自动改打 Cloudflare Pages（已把 github.io 列入来源白名单）；
   本地预览只打本机，避免测试时真的发出邮件。 */
var API_BASES = (function () {
  var host = location.hostname || '';
  if (/^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\])$/.test(host)) return [''];
  if (/\.github\.io$/i.test(host)) return ['https://shenge-work.pages.dev'];
  return ['', 'https://shenge-work.pages.dev'];
})();
function apiFetch(path, opts) {
  var i = 0;
  var tried = {};
  function next() {
    if (i >= API_BASES.length) return Promise.reject(new Error('no_api'));
    var url = new URL(API_BASES[i++] + path, location.href).href;
    if (tried[url]) return next();
    tried[url] = 1;
    return fetch(url, opts).then(function (r) {
      var ct = r.headers.get('content-type') || '';
      if (r.status === 404 || r.status === 405 || ct.indexOf('application/json') < 0) return next();
      return r.json().then(function (j) { return { ok: r.ok, status: r.status, body: j }; });
    }, function () { return next(); });
  }
  return next();
}

document.getElementById('dlForm').addEventListener('submit', function (e) {
  e.preventDefault();
  if (DL_STATE.sending) return;
  var tip = document.getElementById('dlTip');
  var to = dlRecipients();
  var email = document.getElementById('dlEmail').value.trim();
  var bad = to.filter(function (x) { return !DL_EMAIL_RE.test(x); });

  function fail(msg, focusId) {
    tip.textContent = msg;
    tip.style.color = '#C62828';
    var el = document.getElementById(focusId);
    if (el) el.focus();
  }

  if (!to.length) { fail('请填写收件人邮箱——简历会发到这个地址', 'dlTo'); return; }
  if (to.length > 3) { fail('一次最多发给 3 个收件人，请减少一些', 'dlTo'); return; }
  if (bad.length) { fail('收件人邮箱格式不正确：' + bad[0], 'dlTo'); return; }
  if (email && !DL_EMAIL_RE.test(email)) { fail('你的邮箱格式不正确（可留空）', 'dlEmail'); return; }

  tip.textContent = '邮件由系统发送，收件人点开链接即可查看完整简历';
  tip.style.color = '';

  function showMailtoFallback(msg) {
    dlTrack('resume_deliver_result', { status: 'fallback' });
    var a = document.getElementById('dlMailto');
    a.href = buildMailto();
    document.getElementById('dlAlt').hidden = false;
    tip.textContent = msg;
  }

  if (/^file:/.test(location.protocol)) {
    showMailtoFallback('本地文件模式：请用邮箱客户端发送');
    return;
  }

  var btn = document.getElementById('dlSend');
  DL_STATE.sending = true;
  btn.disabled = true;
  btn.textContent = '发送中…';
  apiFetch('/api/deliver', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      to: to.join(','),
      name: document.getElementById('dlName').value.trim(),
      email: email,
      note: document.getElementById('dlNote').value.trim()
    })
  })
    .then(function (res) {
      if (res.ok && res.body && res.body.ok) {
        var sentTo = (res.body.to || to).join('、');
        dlTrack('resume_deliver_result', { status: 'success', recipients: to.length });
        closeDeliver();
        alert('已发送 ✉\n简历已发到：' + sentTo + '\n收件人点开邮件里的链接即可查看完整简历。');
      } else if (res.body && (res.body.error === 'resend_not_configured' || res.body.error === 'recipient_not_verified')) {
        showMailtoFallback(res.body.message || '自动发信暂不可用，请用邮箱客户端发送');
      } else if (res.body && res.body.error === 'rate_limited') {
        dlTrack('resume_deliver_result', { status: 'rate_limited' });
        fail(res.body.message || '操作过于频繁，请稍后再试', 'dlTo');
      } else {
        dlTrack('resume_deliver_result', { status: 'error' });
        fail((res.body && res.body.message) || '发送失败，请稍后再试', 'dlTo');
      }
    })
    .catch(function () {
      showMailtoFallback('网络异常，可改用邮箱客户端发送');
    })
    .then(function () {
      DL_STATE.sending = false;
      btn.disabled = false;
      btn.textContent = '发送简历 ▶';
    });
});

/* 黑白打印：临时挂上 bw-print 类再触发打印，结束后自动移除。
   头像换用真实灰度图（images/portrait-bw.jpg）——
   CSS filter 在部分浏览器的真实打印管线中会被丢弃，像素级灰度图在任何打印路径下都可靠；
   页面加载时预取灰度图，确保点击打印时已在缓存、瞬时替换。 */
(function () {
  var bwPreload = new Image();
  bwPreload.src = 'images/portrait-bw.jpg';
})();
function printBW() {
  document.body.classList.add('bw-print');
  var av = document.querySelector('.avatar img');
  if (av && av.getAttribute('src') !== 'images/portrait-bw.jpg') {
    av.setAttribute('data-bw-revert', av.getAttribute('src'));
    av.setAttribute('src', 'images/portrait-bw.jpg');
  }
  setTimeout(function () { window.print(); }, 120);
}
window.addEventListener('afterprint', function () {
  document.body.classList.remove('bw-print');
  var av = document.querySelector('.avatar img');
  if (av && av.hasAttribute('data-bw-revert')) {
    av.setAttribute('src', av.getAttribute('data-bw-revert'));
    av.removeAttribute('data-bw-revert');
  }
});

/* 简历长图：按需加载 html2canvas（本地自托管，断网/境外 CDN 不可达也能用），
   生成后先进入预览，预览内提供下载 / 取消 */
function loadLongImageLib(cb, onFail) {
  if (window.html2canvas) { cb(); return; }
  var s = document.createElement('script');
  s.src = 'assets/vendor/html2canvas.min.js?v=20261118a';
  s.onload = function () { cb(); };
  s.onerror = onFail;
  document.head.appendChild(s);
}

var lgState = { url: null, blob: null, built: false };

function buildLongImageModal() {
  if (lgState.built) return;
  var ov = document.createElement('div');
  ov.className = 'lg-overlay';
  ov.id = 'lgOverlay';
  ov.innerHTML =
    '<div class="lg-panel" role="dialog" aria-modal="true" aria-label="简历长图预览">' +
      '<div class="lg-head">' +
        '<span class="lg-title">简历长图预览</span>' +
        '<button class="lg-close" id="lgClose" aria-label="关闭预览">×</button>' +
      '</div>' +
      '<div class="lg-body"><img id="lgImg" alt="简历长图预览"></div>' +
      '<div class="lg-foot">' +
        '<button class="btn btn-green" id="lgDownload">下载长图 ↓</button>' +
        '<button class="btn" id="lgCancel">取消</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(ov);
  ov.addEventListener('click', function (e) {
    if (e.target === ov) closeLongImagePreview(); /* 点遮罩关闭 */
  });
  document.getElementById('lgClose').addEventListener('click', closeLongImagePreview);
  document.getElementById('lgCancel').addEventListener('click', closeLongImagePreview);
  document.getElementById('lgDownload').addEventListener('click', downloadLongImage);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeLongImagePreview();
  });
  lgState.built = true;
}

function openLongImagePreview(url, blob) {
  buildLongImageModal();
  lgState.url = url;
  lgState.blob = blob;
  document.getElementById('lgImg').src = url;
  document.getElementById('lgOverlay').classList.add('show');
}

function closeLongImagePreview() {
  var ov = document.getElementById('lgOverlay');
  if (!ov || !ov.classList.contains('show')) return;
  ov.classList.remove('show');
  lgState.blob = null;
  if (lgState.url) {
    var u = lgState.url;
    lgState.url = null;
    var img = document.getElementById('lgImg');
    if (img) img.removeAttribute('src'); /* 先断开引用再撤销 blob，避免浏览器报 blob 加载失败 */
    setTimeout(function () { URL.revokeObjectURL(u); }, 2000);
  }
}

function downloadLongImage() {
  var blob = lgState.blob;
  if (!blob) return;
  var fileName = '陈培胜-AIAgent工程师-简历长图.png';
  /* file:// 协议（本地双击打开）下浏览器会忽略 a.download，导致文件名乱、无扩展名；
     改用系统保存对话框（File System Access API），命名与 PNG 类型完全可控 */
  if (location.protocol === 'file:' && window.showSaveFilePicker) {
    window.showSaveFilePicker({
      suggestedName: fileName,
      types: [{ description: 'PNG 图片', accept: { 'image/png': ['.png'] } }]
    }).then(function (handle) {
      return handle.createWritable().then(function (w) {
        return w.write(blob).then(function () { return w.close(); });
      });
    }).then(function () {
      closeLongImagePreview();
    }).catch(function (err) {
      if (err && err.name === 'AbortError') return; /* 用户取消保存，留在预览 */
      alert('保存失败，请重试或右键预览图「另存为」');
    });
    return;
  }
  /* http(s) 环境：直接触发下载，文件名与类型可靠 */
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  closeLongImagePreview();
}

function exportLongImage(btn) {
  var origin = btn.textContent;
  btn.disabled = true;
  btn.textContent = '正在生成…';
  loadLongImageLib(function () {
    var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    ready.then(function () {
      html2canvas(document.querySelector('.sheet'), {
        scale: 2,
        useCORS: true,
        backgroundColor: '#F3EEE2',
        windowWidth: 1100
      }).then(function (canvas) {
        /* 包装 toBlob，失败（如 canvas 被污染）时恢复按钮并提示，避免卡在「正在生成…」 */
        return new Promise(function (resolve, reject) {
          try { canvas.toBlob(function (blob) { blob ? resolve(blob) : reject(new Error('toBlob 返回空')); }, 'image/png'); }
          catch (e) { reject(e); }
        });
      }).then(function (blob) {
        openLongImagePreview(URL.createObjectURL(blob), blob);
        btn.disabled = false;
        btn.textContent = origin;
      }).catch(function (err) {
        btn.disabled = false;
        btn.textContent = origin;
        alert('长图生成失败：' + (err && err.message ? err.message : '未知错误'));
      });
    });
  }, function () {
    btn.disabled = false;
    btn.textContent = origin;
    alert('长图组件加载失败，请检查网络后重试');
  });
}
</script>
