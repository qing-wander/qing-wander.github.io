name: 功能建议
description: 可复用的工程改进、文档补充、体验优化
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        这个仓库是个人求职作品集，不是通用产品。会被优先考虑的：
        可复用的工程改进（降级、可访问性、性能、测试）、文档纠错、隐私与安全增强。
        不接受：引入前端框架重写、替换作者个人内容、广告/推广、纯视觉偏好改动。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述场景与痛点，不要直接跳到实现方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 如有多种方案，请说明取舍；涉及接口/数据表请写明兼容性
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 页面 / 样式
        - AI 问答 / 检索
        - 留言 / 投递 / 核验
        - 管理后台
        - 构建 / 部署 / CI
        - 文档
        - 其他
  - type: checkboxes
    id: willing
    attributes:
      label: 是否愿意提交 PR
      options:
        - label: 我可以按 CONTRIBUTING.md 提交 PR
