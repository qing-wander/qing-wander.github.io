# 每日拉取 GitHub 贡献数据 → data/contributions.json，供首页联系区块热力图读取
#
# 背景：站点是纯静态 Pages，前端拿不到认证后的 GraphQL；这里用 Actions 内置
# GITHUB_TOKEN 调 viewer.contributionsCollection（无需额外配置 secret），
# 落成静态 JSON 后由前端自绘热力图。token 不出 Actions，不进前端。
#
# 只在 JSON 实际变化时提交，避免无意义空提交。

name: Refresh GitHub contributions

on:
  schedule:
    # 每天 UTC 22:20（北京 06:20）错峰执行
    - cron: '20 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-sync      # 与 sync-site-data 同组串行，避免两条流程改同一仓库撞车
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # GraphQL 偶发服务端错误不阻断后续蛇图生成；统计 JSON 缺失时前端仅隐藏统计行
      - name: 拉取贡献数据
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_contributions.py

      # 完整 Platane/snk（非 svg-only）：生成带游走蛇身的贡献图，
      # 明/暗两张落到 data/，由前端 <picture> 按皮肤切换。
      - name: 生成真蛇动效 SVG
        uses: Platane/snk@v3
        with:
          github_user_name: qing-wander
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            data/snake.svg?palette=github&color_snake=%23FF5A1E
            data/snake-dark.svg?palette=github-dark&color_snake=%23FF9A5A

      # snk 每次重生成会覆盖 SVG，所以坐标轴必须在它之后注入：
      # 从 contributions.json 的 weeks 推算月份列，写入月份/星期标签，
      # 让网格与动画共存于同一张图（标签和格子共享 viewBox，缩放对齐）。
      - name: 给蛇图注入月份/星期坐标轴
        continue-on-error: true   # JSON 缺失时保留无坐标图的兜底
        run: python3 scripts/inject_svg_axes.py

      - name: 提交变更
        run: |
          # 容忍文件缺失：统计 JSON 可能因 GraphQL 偶发失败未生成，蛇图由 snk 独立产出
          [ -f data/contributions.json ] && git add data/contributions.json || true
          git add data/snake.svg data/snake-dark.svg 2>/dev/null || true
          if git diff --quiet --cached; then
            echo "贡献数据与蛇图均无变化，无需提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): 更新 GitHub 贡献热力图数据"
          for i in 1 2 3; do
            if ! git fetch origin main --quiet; then
              echo "::warning::fetch 失败，重试"; sleep 5; continue
            fi
            if git rebase origin/main --quiet; then
              if git push --quiet; then
                echo "推送成功（第 $i 次尝试）"
                exit 0
              fi
            else
              echo "::warning::rebase 冲突，放弃本轮"; git rebase --abort || true
            fi
            sleep 5
          done
          echo "::error::三次重试后仍无法推送贡献数据/蛇图"
          exit 1
