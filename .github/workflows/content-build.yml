# 单一真相源 · 内容生成与漂移检查
#
# 目标：resume.html 只能是 data/site-data.json → resume 的生成物。
# 任何直接手改 resume.html、或改了数据忘了重新生成，都在这里红掉。
#
# 三件事：
#   1. render_resume.mjs --check : 生成物与数据是否逐字一致
#   2. validate_content.mjs      : 结构、锁定字段（公司名 / 时间 / 学校）、两页预算
#   3. sync_site_data.py --check : data/site-data.js 快照是否最新
#   4. render_work_details.mjs --check : work/*.html 案例页是否与数据一致
#
# 修法永远只有一条：改 data/site-data.json（或模板），然后本地
#   node scripts/render_resume.mjs && python3 scripts/sync_site_data.py

name: content build

on:
  push:
    branches: [main]
    paths:
      - 'data/site-data.json'
      - 'data/company-profiles.json'
      - 'templates/resume.template.html'
      - 'resume.html'
      - 'scripts/render_resume.mjs'
      - 'scripts/embed_assets.mjs'
      - 'templates/resume.template.html'
      - 'scripts/validate_content.mjs'
      - 'scripts/sync_site_data.py'
      - 'scripts/render_print_previews.mjs'
      - 'scripts/rasterize_print_preview.py'
      - 'js/print-preview.js'
      - 'assets/print-preview/**'
      - 'assets/resume/**'
      - 'functions/api/deliver.js'
      - 'functions/api/deliver-preview.js'
      - 'functions/api/challenge.js'
      - 'functions/_middleware.js'
      - 'functions/lib/deliver-content.js'
      - 'functions/lib/guard.js'
      - 'functions/lib/zip.js'
      - 'admin/public/**'
      - 'functions/api/admin/**'
      - 'functions/lib/admin-auth.js'
      - 'functions/lib/admin-topics.js'
      - 'tests/admin-routes.test.mjs'
      - 'robots.txt'
      - 'tests/deliver.test.mjs'
      - 'tests/zip.test.mjs'
      - 'tests/security-guard.test.mjs'
      - 'tests/middleware-security.test.mjs'
      - 'data/work-details.json'
      - 'data/people.json'
      - 'scripts/sync_people.py'
      - 'templates/work-detail.template.html'
      - 'scripts/render_work_details.mjs'
      - 'work/**'
      - '.github/workflows/content-build.yml'
  pull_request:
    paths:
      - 'data/site-data.json'
      - 'data/company-profiles.json'
      - 'templates/resume.template.html'
      - 'resume.html'
      - 'scripts/render_resume.mjs'
      - 'scripts/embed_assets.mjs'
      - 'templates/resume.template.html'
      - 'scripts/validate_content.mjs'
      - 'scripts/check_resume_pages.mjs'
      - 'scripts/render_print_previews.mjs'
      - 'scripts/rasterize_print_preview.py'
      - 'js/print-preview.js'
      - 'assets/print-preview/**'
      - 'assets/resume/**'
      - 'functions/api/deliver.js'
      - 'functions/api/deliver-preview.js'
      - 'functions/api/challenge.js'
      - 'functions/_middleware.js'
      - 'functions/lib/deliver-content.js'
      - 'functions/lib/guard.js'
      - 'functions/lib/zip.js'
      - 'admin/public/**'
      - 'functions/api/admin/**'
      - 'functions/lib/admin-auth.js'
      - 'functions/lib/admin-topics.js'
      - 'tests/admin-routes.test.mjs'
      - 'robots.txt'
      - 'tests/deliver.test.mjs'
      - 'tests/zip.test.mjs'
      - 'tests/security-guard.test.mjs'
      - 'tests/middleware-security.test.mjs'
      - 'data/work-details.json'
      - 'data/people.json'
      - 'scripts/sync_people.py'
      - 'templates/work-detail.template.html'
      - 'scripts/render_work_details.mjs'
      - 'work/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成物漂移检查
        run: |
          if ! node scripts/embed_assets.mjs --check; then
            echo "::error::functions/lib 与 templates/·data/ 不一致。请运行 node scripts/embed_assets.mjs"
            exit 1
          fi
          if ! node scripts/render_resume.mjs --check; then
            echo "::error file=resume.html::resume.html 与 data/site-data.json 不一致。请运行 node scripts/render_resume.mjs 重新生成，不要手改生成物。"
            exit 1
          fi
          if ! node scripts/render_work_details.mjs --check; then
            echo "::error::work/*.html 与 data/work-details.json 不一致。请运行 node scripts/render_work_details.mjs 重新生成，不要手改案例页。"
            exit 1
          fi

      - name: 内容结构与预算校验
        run: node scripts/validate_content.mjs

      # 字形预算只是近似值，这里用无头 Chrome 真打一份 PDF 数页数。
      # ubuntu-latest 预装 Google Chrome，路径在 /usr/bin/google-chrome。
      - name: 真页数校验（PDF ≤ 2 页）
        run: |
          if [ -z "${CHROME_PATH:-}" ]; then
            export CHROME_PATH=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)
          fi
          node scripts/check_resume_pages.mjs

      # 预览图由真实导出的 PDF 栅格化而来，resume.html 一变就必须重生成。
      # --check 只比对 sha256 与文件存在性，不需要浏览器/栅格化工具。
      - name: 打印预览图是否最新
        run: node scripts/render_print_previews.mjs --check

      - name: JS 快照是否最新
        run: |
          python3 scripts/sync_site_data.py --check
          python3 scripts/sync_company_profiles.py --check
          python3 scripts/sync_people.py --check

      # 含投递凭证、限流、防爬虫中间件的回归用例
      - name: 单元测试
        run: node --test tests/*.test.mjs
