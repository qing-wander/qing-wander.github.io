# 简历知识库语义层 Worker（resume-kb-api）
# 部署：cd worker/kb && npx wrangler deploy
# 密钥：npx wrangler secret put KB_TOKEN   （与 Pages 项目上的 KB_TOKEN 同值）
#
# 说明：Pages 项目的绑定配置不支持 Workers AI / Vectorize，所以把这两个
# 绑定放在 Worker 里；浏览器不直连本 Worker，由 /api/kb 服务端调用。
name = "resume-kb-api"
main = "index.mjs"
compatibility_date = "2025-01-01"
# rebuild.mjs 复用 scripts/lib/rag-chunks.mjs，里面用 node:crypto 算 kb_version
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "resume-kb"

# /rebuild 直接读 D1 的 site_content（云端真相源），重建后写回 kb_chunks
[[d1_databases]]
binding = "DB"
database_name = "portfolio-db"
database_id = "022be169-a84e-4791-b2f2-ee4f9c4f17c8"
